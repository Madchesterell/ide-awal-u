<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direktori UMKM Terdekat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Etalase UMKM Lokal</h1>
        <p>Jelajahi dan Dukung Usaha Tetangga di Sekitar Kita</p>
    </header>

    <!-- Daftar Kartu UMKM -->
    <main class="umkm-grid" id="umkmContainer">
        <!-- Kartu akan diisi otomatis oleh JavaScript agar mudah ditambah/diubah -->
    </main>

    <!-- Jendela Detail (Modal Pop-up) saat Kartu Dibuka -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="tutupDetail()">&times;</span>
            <h2 id="modalNama">Nama UMKM</h2>
            <span id="modalKategori" class="badge">Kategori</span>
            
            <div class="info-group">
                <p><strong>📍 Alamat:</strong> <span id="modalAlamat"></span></p>
                <p><strong>🗺️ Lokasi Peta:</strong> <a id="modalMaps" href="#" target="_blank">Buka di Google Maps</a></p>
                <p><strong>📞 Telepon / WA:</strong> <a id="modalTelepon" href="#" target="_blank">Hubungi Penjual</a></p>
                <p><strong>🛵 Pesan Online:</strong> <span id="modalOnline"></span></p>
            </div>

            <h3>Daftar Menu & Produk:</h3>
            <ul id="modalMenu" class="menu-list">
                <!-- Daftar menu muncul di sini -->
            </ul>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Pelita Digital UMKM Lokal | Dirangkai oleh Sinuhun</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
